name: lumari-backend
services:
  api:
    image: ghcr.io/davinci7070/lumari-backend:latest
    container_name: lumari-api
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"
    environment:
      LOG_LEVEL: DEBUG
      PYTHONUNBUFFERED: "1"
      ORCHESTRATOR_URL: http://orchestrator:8000 # Nun auf der gleichen Maschine (im gleichen Docker-Netz)

      # PostgreSQL (intern im Compose-Netz erreichbar)
      # Die Werte kommen aus der .env-Datei
      DATABASE_URL: "postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres_db:5432/${POSTGRES_DB}"
      # Qdrant (intern im Compose-Netz erreichbar)
      QDRANT_URL: http://qdrant:6333
      # optional, falls du in Qdrant Auth aktivierst / Cloud nutzt:
      # QDRANT_API_KEY: "..."
      # optional: damit dein MCP/Backend ggf. gRPC bevorzugt
      # QDRANT_PREFER_GRPC: "false"
      # optional: Embedding model selection (wenn dein Backend das nutzt)
      # EMBED_MODEL_NAME: "sentence-transformers/paraphrase-multilingual-MiniLM-L12-v2"


    ports:
      - "80:8000"
    networks:
      - lumari-net
    depends_on:
      postgres_db:
        condition: service_healthy
      qdrant:
        condition: service_started
    healthcheck:
      test: [ "CMD-SHELL", "curl -fsS http://localhost:8000/health || exit 1" ]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 20s

  mcp-search:
    image: ghcr.io/davinci7070/lumari-backend:latest
    container_name: lumari-mcp_services-search
    restart: unless-stopped
    command: [ "python", "-u", "app/mcp_services/qdrant_mcp_server.py" ]
    environment:
      QDRANT_URL: http://qdrant:6333
      MCP_TRANSPORT: http
      MCP_HOST: 0.0.0.0
      MCP_PORT: "9000"
      MCP_PATH: /mcp_services
    ports:
      - "9000:9000" # nur diesen Port braucht die GPU-VM
    networks:
      - lumari-net
    depends_on:
      - qdrant

  qdrant:
    image: qdrant/qdrant:latest
    container_name: lumari-qdrant
    restart: unless-stopped
    volumes:
      - qdrant_storage:/qdrant/storage
    networks:
      - lumari-net

  postgres_db:
    image: postgres:16-alpine
    container_name: lumari-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    # ports:
    #   - "5432:5432"  # Nur für lokales Debugging freigeben
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - lumari-net
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U lumari_user -d lumari_reports" ]
      interval: 10s
      timeout: 5s
      retries: 5

  fail2ban:
    image: crazymax/fail2ban:latest
    container_name: lumari-fail2ban
    restart: unless-stopped
    network_mode: host
    cap_add:
      - NET_ADMIN
      - NET_RAW
    volumes:
      - ./fail2ban/jail.local:/data/jail.d/jail.local:ro
      - ./fail2ban/filter.d/lumari-api.conf:/data/filter.d/lumari-api.conf:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - fail2ban_data:/data/db
    environment:
      TZ: Europe/Berlin
    depends_on:
      - api

volumes:
  qdrant_storage:
  postgres_data:
    driver: local
  fail2ban_data:


networks:
  lumari-net:
    external: true
