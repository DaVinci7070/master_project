name: lumari-agents
version: "3.9"

# Gemeinsame LLM-/Runtime-Umgebung für alle Agenten
x-agent-env: &agent-env
  # Google Gemini 2.0 Flash (OpenAI-compatible)
  VLLM_BASE_URL: "https://generativelanguage.googleapis.com/v1beta/openai/"
  VLLM_API_KEY: "${GEMINI_API_KEY}"
  VLLM_MODEL: "gemini-2.0-flash"
  PYTHONUNBUFFERED: "1"
 
  # Basis-URLs der Agents im Docker-Netz
  ORCHESTRATOR_URL:  http://orchestrator:8000/
  RAG_URL:           http://rag:8004/
  SUMMARIZER_URL:    http://summarizer:8001/
  GUARD_URL:         http://guard:8005/
  QUESTION_URL:      http://question:8007/
  MCP_BASE_URL:      http://lumari-mcp_services-search:9000
  DEFECT_URL:        http://defect:8008/
  SAFETY_URL:        http://safety:8009/
  CLAIM_URL:         http://claim:8010/
  QUALITY_URL:       http://quality:8011/

x-agent-base: &agent-base
  image: lumari-agents-local:latest
  restart: unless-stopped
  environment:
    <<: *agent-env
  networks:
    - lumari-net
#  healthcheck:
#    # A2AStarletteApplication bringt in der Regel /ping mit
#    test: ["CMD-SHELL", "curl -fsS http://localhost:${PORT:-8000}/ping || exit 1"]
#    interval: 10s
#    timeout: 5s
#    retries: 10
#    start_period: 20s

services:

  # -------------------------
  # Orchestrator-Agent
  # -------------------------
  orchestrator:
    <<: *agent-base
    container_name: lumari-orchestrator
    environment:
      <<: *agent-env
      ROLE: agent_orchestrator            # wird vom entrypoint.sh ausgewertet
      PORT: 8000
      ORCHESTRATION_STORAGE_DIR: /data/orchestration_states
    volumes:
      - orchestrator_data:/data/orchestration_states
    ports:
      - "8000:8000"

  # -------------------------
  # RAG-Agent
  # -------------------------
  rag:
    <<: *agent-base
    container_name: lumari-rag
    environment:
      <<: *agent-env
      ROLE: agent_rag
      PORT: 8004
    ports:
      - "8004:8004"

  # -------------------------
  # Summarizer-Agent
  # -------------------------
  summarizer:
    <<: *agent-base
    container_name: lumari-summarizer
    environment:
      <<: *agent-env
      ROLE: agent_summarizer
      PORT: 8001
    ports:
      - "8001:8001"

  # -------------------------
  # Guard-Agent
  # -------------------------
  guard:
    <<: *agent-base
    container_name: lumari-guard
    environment:
      <<: *agent-env
      ROLE: agent_guard
      PORT: 8005
    ports:
      - "8005:8005"

  # -------------------------
  # Template-Agent
  # -------------------------
  template:
    <<: *agent-base
    container_name: lumari-template
    environment:
      <<: *agent-env
      ROLE: agent_template
      PORT: 8006
    ports:
      - "8006:8006"

  # -------------------------
  # Question-Agent
  # -------------------------
  question:
    <<: *agent-base
    container_name: lumari-question
    environment:
      <<: *agent-env
      ROLE: agent_question
      PORT: 8007
    ports:
      - "8007:8007"

  # -------------------------
  # Defect-Agent
  # -------------------------
  defect:
    <<: *agent-base
    container_name: lumari-defect
    environment:
      <<: *agent-env
      ROLE: agent_defect
      PORT: 8008
    ports:
      - "8008:8008"

  # -------------------------
  # Safety-Agent
  # -------------------------
  safety:
    <<: *agent-base
    container_name: lumari-safety
    environment:
      <<: *agent-env
      ROLE: agent_safety
      PORT: 8009
    ports:
      - "8009:8009"

  # -------------------------
  # Claim-Agent
  # -------------------------
  claim:
    <<: *agent-base
    container_name: lumari-claim
    environment:
      <<: *agent-env
      ROLE: agent_claim
      PORT: 8010
    ports:
      - "8010:8010"

  # -------------------------
  # Quality-Agent
  # -------------------------
  quality:
    <<: *agent-base
    container_name: lumari-quality
    environment:
      <<: *agent-env
      ROLE: agent_quality
      PORT: 8011
    ports:
      - "8011:8011"


volumes:
  orchestrator_data:

networks:
  lumari-net:
    external: true
