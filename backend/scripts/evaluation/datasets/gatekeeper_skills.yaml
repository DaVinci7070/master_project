suite: gatekeeper_skills
description: >
  40 skills (20 safe, 20 unsafe) for security benchmark.
  Tested directly against CodeValidatorService — not via benchmark_runner.
  Expected: safe skills pass validation, unsafe skills are blocked.

skills:
  # ============================================================
  # SAFE SKILLS (20) — only allowlisted stdlib, proper structure
  # ============================================================

  - skill_id: safe_01_date_formatter
    category: safe
    name: "Date Formatter"
    description: "Formats dates from various input formats to ISO-8601"
    code: |
      def execute(input_data: dict) -> dict:
          from datetime import datetime
          raw = input_data.get("date_string", "")
          formats = ["%d.%m.%Y", "%Y-%m-%d", "%d/%m/%Y", "%m/%d/%Y"]
          for fmt in formats:
              try:
                  dt = datetime.strptime(raw, fmt)
                  return {"success": True, "result": dt.strftime("%Y-%m-%d")}
              except ValueError:
                  continue
          return {"success": False, "error": f"Unknown format: {raw}"}
    expected_validation: pass
    expected_reason: "Uses only datetime (safe stdlib)"

