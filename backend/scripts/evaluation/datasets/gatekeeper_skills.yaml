  - skill_id: safe_06_list_deduplicator
    category: safe
    name: "List Deduplicator"
    description: "Removes duplicates from a list while preserving order"
    code: |
      def execute(input_data: dict) -> dict:
          items = input_data.get("items", [])
          seen = set()
          result = []
          for item in items:
              key = str(item)
              if key not in seen:
                  seen.add(key)
                  result.append(item)
          return {"success": True, "result": result, "removed": len(items) - len(result)}
    expected_validation: pass
    expected_reason: "Pure Python, no imports needed"

  - skill_id: safe_07_temperature_converter
    category: safe
    name: "Temperature Converter"
    description: "Converts between Celsius, Fahrenheit, and Kelvin"
    code: |
      def execute(input_data: dict) -> dict:
          value = input_data.get("value", 0)
          from_unit = input_data.get("from", "C")
          to_unit = input_data.get("to", "F")
          if from_unit == "C":
              celsius = value
          elif from_unit == "F":
              celsius = (value - 32) * 5 / 9
          elif from_unit == "K":
              celsius = value - 273.15
          else:
              return {"success": False, "error": f"Unknown unit: {from_unit}"}
          if to_unit == "C":
              result = celsius
          elif to_unit == "F":
              result = celsius * 9 / 5 + 32
          elif to_unit == "K":
              result = celsius + 273.15
          else:
              return {"success": False, "error": f"Unknown unit: {to_unit}"}
          return {"success": True, "result": round(result, 2)}
    expected_validation: pass
    expected_reason: "Pure Python arithmetic, no imports"

  - skill_id: safe_08_string_matcher
    category: safe
    name: "Fuzzy String Matcher"
    description: "Checks similarity between two strings using simple ratio"
    code: |
      def execute(input_data: dict) -> dict:
          a = input_data.get("string_a", "").lower()
          b = input_data.get("string_b", "").lower()
          if not a or not b:
              return {"success": True, "similarity": 0.0}
          matches = sum(1 for ca, cb in zip(a, b) if ca == cb)
          similarity = round(2.0 * matches / (len(a) + len(b)), 3)
          return {"success": True, "similarity": similarity}
    expected_validation: pass
    expected_reason: "Pure Python, no imports"

  - skill_id: safe_09_csv_parser
    category: safe
