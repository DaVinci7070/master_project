          lines = raw.strip().split("\n")
          if not lines:
              return {"success": False, "error": "Empty input"}
          headers = [h.strip() for h in lines[0].split(",")]
          rows = []
          for line in lines[1:]:
              values = [v.strip() for v in line.split(",")]
              rows.append(dict(zip(headers, values)))
