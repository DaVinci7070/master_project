      def execute(input_data: dict) -> dict:
          import re
          text = input_data.get("text", "")
          pattern = input_data.get("pattern", r"^#{1,3}\s+(.+)$")
          parts = re.split(pattern, text, flags=re.MULTILINE)
          sections = []
