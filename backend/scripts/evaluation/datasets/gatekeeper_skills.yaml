          minutes = seconds // 60
          hours = minutes // 60
          days = hours // 24
          parts = []
          if days: parts.append(f"{days}d")
          if hours % 24: parts.append(f"{hours % 24}h")
          if minutes % 60: parts.append(f"{minutes % 60}m")
