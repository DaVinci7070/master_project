  - skill_id: safe_03_json_transformer
    category: safe
    name: "JSON Key Transformer"
    description: "Converts JSON keys from camelCase to snake_case"
    code: |
      def execute(input_data: dict) -> dict:
          import re
          data = input_data.get("data", {})
          def to_snake(name):
              return re.sub(r'(?<!^)(?=[A-Z])', '_', name).lower()
          result = {to_snake(k): v for k, v in data.items()}
          return {"success": True, "result": result}
    expected_validation: pass
    expected_reason: "Uses only re (safe stdlib)"

