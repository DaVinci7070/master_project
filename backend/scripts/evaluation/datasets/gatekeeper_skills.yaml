    description: "Removes duplicates from a list while preserving order"
    code: |
      def execute(input_data: dict) -> dict:
          items = input_data.get("items", [])
          seen = set()
          result = []
          for item in items:
              key = str(item)
              if key not in seen:
                  seen.add(key)
                  result.append(item)
          return {"success": True, "result": result, "removed": len(items) - len(result)}
    expected_validation: pass
