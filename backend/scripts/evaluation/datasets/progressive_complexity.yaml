        - "Ostseite: 4 korrodierte Befestigungsduebel im 14.OG und Algenbefall 3.-5. OG (ca. 25 m2)"
        - "Suedseite: Undichter Anschluss Fensterbank/WDVS bei 3 Fenstern im 7.OG"
        - "Bewertung nach WTA-Merkblatt 2-13: Instandsetzungskategorie IC2"
        - "Geschaetzte Kosten: Nordseite 45.000, Ost 28.000, Sued 12.000 EUR, Gesamt 85.000 EUR"
        - "Dringlichkeit: Ost SOFORT, Nord/Sued innerhalb 12 Monate"

  - task_id: L4_demolition_planning_report
    level: L4
    description: >
      Erstelle einen Rueckbauplanungsbericht mit Schadstoffkataster:
      Objekt: Ehem. Postgebaeude Bahnhofstrasse 1, Baujahr 1964,
      5 Geschosse, ca. 4.200 m2 BGF. Geplanter Totalrueckbau fuer
      Neubau. Schadstofferkundung am 28.03.2026 durch Gutachter
      Dr. Gruen (DGUV-zertifiziert). Befunde: 1) Asbest: Asbestzement-
      Fassadenplatten (chrysotil, geschaetzt 1.200 m2), Floorflexplatten
      in 2 Treppenhaeusern (ca. 180 m2), Rohrisolierung Heizung UG
      (Spritzasbest, ca. 45 lfm — Gefahrenstufe HOCH). 2) KMF:
      Mineralwolledaemmung Dach und Fassade (Einbau vor 1996, alte
      Mineralwolle = kuenstliche Mineralfaser TRGS 521). 3) PCB:
      Dehnungsfugenabdichtung EG-3.OG, geschaetzt 120 lfm (Proben
      ergaben 2.400 mg/kg — Sanierungsleitwert 300 mg/kg UEBERSCHRITTEN).
      4) PAK: Teerpappe Flachdach ca. 850 m2.
      Rueckbaukonzept: Selektiver Rueckbau in 4 Phasen. Phase 1:
      Schadstoffsanierung (8 Wochen, Kosten 185.000 EUR). Phase 2:
      Entkernung (3 Wochen, 45.000 EUR). Phase 3: Abbruch Tragwerk
      (4 Wochen, 120.000 EUR). Phase 4: Kellerrueckbau und Verfuellung
      (2 Wochen, 35.000 EUR). Gesamtkosten: 385.000 EUR.
      Genehmigung: Abbruchantrag nach BauO, Anzeige nach GefStoffV §15a.
    ground_truth:
      required_claims:
        - "Das Objekt ist das ehemalige Postgebaeude Bahnhofstrasse 1, Baujahr 1964, 5 Geschosse, 4.200 m2 BGF"
        - "Schadstofferkundung durch Gutachter Dr. Gruen (DGUV-zertifiziert)"
        - "Asbest: Fassadenplatten 1.200 m2, Floorflexplatten 180 m2, Spritzasbest Heizung UG 45 lfm (Gefahrenstufe HOCH)"
        - "KMF: Mineralwolledaemmung Dach und Fassade (TRGS 521)"
        - "PCB: Dehnungsfugenabdichtung 120 lfm, 2.400 mg/kg gemessen (Sanierungsleitwert 300 mg/kg ueberschritten)"
        - "Selektiver Rueckbau in 4 Phasen: Schadstoffsanierung (185.000 EUR), Entkernung (45.000 EUR), Abbruch (120.000 EUR), Kellerrueckbau (35.000 EUR)"
        - "Gesamtkosten 385.000 EUR"
        - "Genehmigung: Abbruchantrag nach BauO, Anzeige nach GefStoffV §15a"

  - task_id: L4_accessibility_audit
    level: L4
    description: >
