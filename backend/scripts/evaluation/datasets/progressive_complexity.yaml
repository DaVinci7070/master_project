suite: progressive_complexity
description: >
  37 construction-domain tasks across 5 complexity levels (L1-L5).
  L1-L4: text-based challenges (30 tasks). L5: autonomous infrastructure
  challenges — DB schema discovery, ETL pipeline, audio transcription (7 tasks).
  Designed per EVALUATION_STRATEGY.md for Pass@1 measurement and ablation studies.
  Uses claim-based evaluation (LLM-as-Judge) for semantic matching.
tasks:
  # ============================================================
  # L1 — Standard (8 tasks): System can solve immediately
  # Simple transcripts, single speaker, clear structure
  # ============================================================

  - task_id: L1_simple_daily_report
    level: L1
    description: >
      Erstelle einen Tagesbericht aus folgendem Baustellenrundgang:
      Datum 15.04.2026, Baustelle Musterstrasse 12, Berlin-Mitte.
      Wetter sonnig, 18 Grad, leichter Wind. Anwesend: Polier Mueller,
      5 Arbeiter Rohbau, 2 Arbeiter Elektro. Arbeiten: Betonage Decke
      EG abgeschlossen um 14:30 Uhr, Bewehrung OG begonnen.
      Materiallieferung: 12 m3 Beton C25/30 per LKW angeliefert,
      komplett verbaut. Keine besonderen Vorkommnisse.
    ground_truth:
      required_claims:
        - "Der Bericht bezieht sich auf die Baustelle Musterstrasse 12 in Berlin-Mitte"
        - "Das Datum ist der 15.04.2026"
        - "Das Wetter war sonnig bei 18 Grad mit leichtem Wind"
        - "Polier Mueller war anwesend"
        - "Es waren 5 Arbeiter Rohbau und 2 Arbeiter Elektro vor Ort"
        - "Die Betonage der Decke EG wurde um 14:30 Uhr abgeschlossen"
        - "Die Bewehrung OG wurde begonnen"
        - "12 m3 Beton C25/30 wurden per LKW angeliefert und komplett verbaut"

  - task_id: L1_defect_list
    level: L1
    description: >
      Erstelle eine Maengelliste aus folgendem Abnahmegespraech:
      Objekt Wohnhaus Gartenweg 5, Abnahme am 10.04.2026 mit
      Bauherr Schneider und Bauleiter Braun. Mangel 1: Riss in
      Wohnzimmerdecke EG, ca. 30cm lang, Haarriss. Mangel 2:
      Badezimmer OG Fliesen uneben, 3 Fliesen locker. Mangel 3:
      Haustuer schliesst nicht buendig, Spalt links unten 5mm.
      Frist zur Behebung: 4 Wochen ab Abnahme. Alle Maengel
      fotografisch dokumentiert.
    ground_truth:
      required_claims:
        - "Das Objekt ist das Wohnhaus Gartenweg 5"
        - "Die Abnahme fand am 10.04.2026 statt"
        - "Bauherr Schneider und Bauleiter Braun waren beteiligt"
        - "Ein Haarriss von ca. 30cm in der Wohnzimmerdecke EG wurde festgestellt"
        - "Im Badezimmer OG sind 3 Fliesen locker"
        - "Die Haustuer schliesst nicht buendig mit einem Spalt von 5mm links unten"
        - "Die Frist zur Behebung betraegt 4 Wochen ab Abnahme"

  - task_id: L1_safety_protocol
    level: L1
    description: >
      Erstelle ein Sicherheitsprotokoll aus folgender Baustellenbegehung:
      Baustelle Neubau Schule Am Stadtpark, 12.04.2026, Begehung durch
      Sicherheitsingenieur Weber. Ergebnis: PSA vollstaendig bei allen
      Arbeitern (Helm, Schuhe, Weste). Geruest Nordseite ordnungsgemaess
      geprueft, Pruefplakette gueltig bis 06/2026. Baugrube Ost mit
      Absperrung und Warnschildern gesichert. Erste-Hilfe-Kasten im
      Baucontainer vollstaendig. Keine Beanstandungen.
    ground_truth:
      required_claims:
        - "Die Begehung fand am 12.04.2026 auf der Baustelle Neubau Schule Am Stadtpark statt"
        - "Sicherheitsingenieur Weber fuehrte die Begehung durch"
        - "Die PSA war bei allen Arbeitern vollstaendig (Helm, Schuhe, Weste)"
        - "Das Geruest Nordseite wurde ordnungsgemaess geprueft mit Pruefplakette gueltig bis 06/2026"
        - "Die Baugrube Ost ist mit Absperrung und Warnschildern gesichert"
        - "Der Erste-Hilfe-Kasten im Baucontainer ist vollstaendig"
        - "Es gab keine Beanstandungen"

  - task_id: L1_material_delivery_log
    level: L1
    description: >
      Erstelle ein Materiallieferungsprotokoll aus folgender Lieferung:
      Baustelle Buerogebaeude Industriestrasse 44, 11.04.2026.
      Lieferant: Baustoffhandel Schmidt GmbH. Lieferschein Nr. LS-2026-4411.
      Geliefert: 200 Saecke Zement CEM II 32,5 R (je 25kg = 5.000 kg),
      50 m3 Kies 0/16, 120 Stahlmatten Q335A (6x2,3m). Alle Mengen
      vollstaendig laut Bestellung. Annahme durch Polier Hoffmann
      um 08:15 Uhr. Lagerplatz: Nordseite Baufeld.
    ground_truth:
      required_claims:
        - "Die Lieferung ging an die Baustelle Buerogebaeude Industriestrasse 44"
        - "Das Lieferdatum ist der 11.04.2026"
        - "Der Lieferant ist Baustoffhandel Schmidt GmbH"
        - "Der Lieferschein hat die Nummer LS-2026-4411"
        - "Es wurden 200 Saecke Zement CEM II 32,5 R geliefert (5.000 kg)"
        - "Es wurden 50 m3 Kies 0/16 geliefert"
        - "Es wurden 120 Stahlmatten Q335A geliefert"
        - "Polier Hoffmann nahm die Lieferung um 08:15 Uhr an"

  - task_id: L1_weather_delay_report
    level: L1
    description: >
      Erstelle einen Verzoegerungsbericht wegen Wetterbedingungen:
      Baustelle Parkhaus Messegelaende, 09.04.2026. Starkregen seit
      06:00 Uhr, Niederschlag 35mm in 4 Stunden. Betonierarbeiten
      Decke 2. OG mussten abgebrochen werden, da Frischbeton nicht
      verarbeitbar. Kranarbeiten eingestellt wegen Windstaerke 7.
      Erdarbeiten Tiefgarage ruhen wegen Wassereinbruch. Bauarbeiter
      im Baucontainer. Voraussichtliche Wiederaufnahme morgen
      10.04.2026 ab 07:00 bei Wetterbesserung.
    ground_truth:
      required_claims:
        - "Der Bericht betrifft die Baustelle Parkhaus Messegelaende am 09.04.2026"
        - "Starkregen seit 06:00 Uhr mit 35mm Niederschlag in 4 Stunden"
        - "Die Betonierarbeiten Decke 2. OG mussten abgebrochen werden"
        - "Kranarbeiten wurden wegen Windstaerke 7 eingestellt"
        - "Erdarbeiten Tiefgarage ruhen wegen Wassereinbruch"
        - "Die Wiederaufnahme ist fuer den 10.04.2026 ab 07:00 Uhr geplant"

  - task_id: L1_daily_workforce_report
    level: L1
    description: >
      Erstelle einen Personalstaerkebericht fuer folgende Baustelle:
      Neubau Mehrfamilienhaus Lindenallee 8, 14.04.2026. Anwesend:
      Rohbau-Kolonne (Firma Bauer): 1 Polier, 6 Facharbeiter, 2 Helfer.
      Elektro-Kolonne (Firma Volt): 1 Meister, 3 Gesellen.
      Sanitaer (Firma Rohr): 2 Monteure. Krank gemeldet: 1 Facharbeiter
      Rohbau (Maier, seit 12.04). Arbeitszeit: 07:00-16:30, Pause
      12:00-12:30. Gesamtstunden: 9,5h x 15 Personen = 142,5 Stunden.
    ground_truth:
      required_claims:
        - "Der Bericht bezieht sich auf Neubau Mehrfamilienhaus Lindenallee 8 am 14.04.2026"
        - "Die Rohbau-Kolonne der Firma Bauer umfasst 1 Polier, 6 Facharbeiter und 2 Helfer"
        - "Die Elektro-Kolonne der Firma Volt hat 1 Meister und 3 Gesellen"
        - "Firma Rohr stellt 2 Monteure fuer Sanitaer"
        - "Facharbeiter Maier ist seit 12.04 krank gemeldet"
        - "Die Arbeitszeit war von 07:00 bis 16:30 mit Pause von 12:00 bis 12:30"
        - "Die Gesamtstunden betragen 142,5 Stunden (9,5h x 15 Personen)"

  - task_id: L1_concrete_pour_protocol
    level: L1
    description: >
      Erstelle ein Betonierprotokoll fuer folgenden Betoniervorgang:
      Baustelle Brueckenbauwerk B42, 13.04.2026. Bauteil: Widerlager West.
      Betonsorte: C30/37, XC4, XF3, WF. Betonmenge: 45 m3.
      Lieferwerk: Transportbeton Rhein GmbH, Werk Koblenz.
      Einbaubeginn: 07:30, Einbauende: 12:15. Frischbetontemperatur:
      14-16 Grad C. Ausbreitmaass: a1=48cm, a2=50cm (Soll: 42-52cm).
      Proben: 3 Wuerfelsaetze entnommen (Pruefstelle: IB Meyer).
      Verdichtung: Innenruettler. Nachbehandlung: Abdeckung mit
      PE-Folie, Bewässerung ab Tag 2.
    ground_truth:
      required_claims:
        - "Das Bauteil ist das Widerlager West am Brueckenbauwerk B42"
        - "Die Betonsorte ist C30/37 mit Expositionsklassen XC4, XF3, WF"
        - "Die Betonmenge betraegt 45 m3 vom Lieferwerk Transportbeton Rhein GmbH Koblenz"
        - "Der Einbau erfolgte von 07:30 bis 12:15"
        - "Die Frischbetontemperatur lag bei 14-16 Grad C"
        - "Das Ausbreitmaass war a1=48cm und a2=50cm (Soll: 42-52cm)"
        - "3 Wuerfelsaetze wurden entnommen, Pruefstelle IB Meyer"
        - "Die Nachbehandlung erfolgte mit PE-Folie und Bewaesserung ab Tag 2"

  - task_id: L1_site_handover_note
    level: L1
    description: >
      Erstelle eine Baustellenuebergabenotiz fuer folgenden Vorgang:
      Baustelle Kita Sonnenschein, Blumenweg 3, 08.04.2026.
      Uebergabe von Bauleiter Krause (Urlaub ab 09.04) an Bauleiter
      Richter. Aktueller Stand: Rohbau EG fertig, Dachstuhl in
      Aufrichtung (ca. 60%). Offene Punkte: Lieferung Dachfenster
      ausstehend (KW 16), Statikfreigabe Balkon noch offen (Buero
      Ingmann). Kein offener Mangel. Schluesseluebergabe erfolgt.
    ground_truth:
      required_claims:
        - "Die Uebergabe betrifft die Baustelle Kita Sonnenschein am Blumenweg 3"
        - "Bauleiter Krause uebergibt an Bauleiter Richter wegen Urlaub ab 09.04"
        - "Der Rohbau EG ist fertiggestellt"
        - "Der Dachstuhl ist zu ca. 60% aufgerichtet"
        - "Die Lieferung der Dachfenster steht noch aus (KW 16)"
        - "Die Statikfreigabe Balkon vom Buero Ingmann ist noch offen"
        - "Die Schluesseluebergabe ist erfolgt"

  # ============================================================
  # L2 — Extended (8 tasks): Light adaptation needed
  # Multiple speakers, colloquial language, domain mixing
  # ============================================================

  - task_id: L2_combined_defect_safety
    level: L2
    description: >
      Erstelle einen kombinierten Maengel- und Sicherheitsbericht aus
      folgender Baubesprechung mit mehreren Teilnehmern:
      Baustelle Industriepark Nord, 14.04.2026. Anwesend: Bauleiter
      Schmidt, Sicherheitsingenieur Weber, Polier Huber, Vertreter
      Nachunternehmer Elektro (Firma Licht GmbH).
      Schmidt: "Also der Riss in der Stuetzwand Achse 3, den muessen
      wir uns genauer anschauen, der ist jetzt ca. 2mm breit und 1,5m
      lang." Weber: "Und bei der PSA-Kontrolle heute Morgen hab ich
      zwei Leute ohne Helm erwischt, das geht so nicht." Huber: "Die
      Absperrung an der Grube Ost fehlt wieder, ich hab das schon
      dreimal gesagt." Schmidt: "Ausserdem ist das Geruest Nordseite
      seit 3 Wochen nicht geprueft." Weber: "Ich klaer das mit dem
      TUeV." Schmidt: "Den Riss lassen wir vom Statiker begutachten
      bis zum 18.04. Absperrung wird heute noch nachgeruestet."
    ground_truth:
      required_claims:
        - "Die Besprechung fand auf der Baustelle Industriepark Nord am 14.04.2026 statt"
        - "Ein Riss in der Stuetzwand Achse 3 ist ca. 2mm breit und 1,5m lang"
        - "Bei der PSA-Kontrolle wurden zwei Personen ohne Helm festgestellt"
        - "Die Absperrung an der Grube Ost fehlt"
        - "Das Geruest Nordseite ist seit 3 Wochen nicht geprueft"
        - "Der Riss soll vom Statiker bis zum 18.04 begutachtet werden"
        - "Die Absperrung wird heute noch nachgeruestet"

  - task_id: L2_daily_with_supplements
    level: L2
    description: >
      Erstelle einen Tagesbericht mit Nachtragerfassung aus folgender
      Baubesprechung: Baustelle Wohnanlage Sonnenhof, 13.04.2026.
      Polier Wagner: "Wir haben heute beim Aushub Altlasten gefunden,
      sieht nach oelkontaminiertem Boden aus, ca. 15 m3." Bauleiter
      Meier: "OK das ist ein Nachtrag, schreib das auf. Was kostet
      die Entsorgung?" Wagner: "Laut Entsorger Umwelt AG ca. 280 EUR
      pro Tonne, bei geschaetzt 25 Tonnen sind das 7.000 EUR netto."
      Meier: "Dazu kommt der Baggermehraufwand, ich schaetz 2 Tage
      extra, das sind nochmal 3.200 EUR." Wagner: "Bewehrung Keller
      laeuft planmaessig, 60% fertig. Und die Schalung Aufzugsschacht
      steht, koennen morgen betonieren." Meier: "Wetter soll halten.
      Nachtragsanmeldung schick ich heute noch an den AG."
    ground_truth:
      required_claims:
        - "Der Bericht betrifft die Baustelle Wohnanlage Sonnenhof am 13.04.2026"
        - "Beim Aushub wurden Altlasten gefunden, ca. 15 m3 oelkontaminierter Boden"
        - "Die Entsorgungskosten betragen ca. 280 EUR pro Tonne, geschaetzt 7.000 EUR netto"
        - "Der Baggermehraufwand wird auf 2 Tage extra geschaetzt (3.200 EUR)"
        - "Die Bewehrung Keller laeuft planmaessig und ist zu 60% fertig"
        - "Die Schalung Aufzugsschacht steht und kann morgen betoniert werden"
        - "Eine Nachtragsanmeldung wird an den Auftraggeber geschickt"

  - task_id: L2_multi_trade_inspection
    level: L2
    description: >
      Erstelle ein gewerkeuebergreifendes Inspektionsprotokoll:
      Baustelle Buerogebaeude TechPark 7, 12.04.2026. Inspektion
      durch Bauleiter Fischer mit den Gewerken Rohbau (Firma Stein),
      Heizung (Firma Waerme), Elektro (Firma Strom), Trockenbau
      (Firma Wand). Rohbau: Decke 3.OG ausgeschalt, Oberflaechenqualitaet
      gut, 2 Kiesnester an Stuetze D4 muessen verpresst werden.
      Heizung: Rohrleitungen EG verlegt, Druckpruefung 10 bar bestanden.
      Elektro: Schlitze 1.OG gefraest, Leerrohre 70% eingebaut, Koordination
      mit Trockenbau wegen Deckenabhaengung erforderlich. Trockenbau:
      Staenderwerk 2.OG aufgestellt, Beplankung beginnt naechste Woche.
      Problem: Heizungsrohre im 2.OG liegen teils im Trockenbau-Querschnitt.
    ground_truth:
      required_claims:
        - "Die Inspektion fand am 12.04.2026 auf der Baustelle Buerogebaeude TechPark 7 statt"
        - "Rohbau (Firma Stein): Decke 3.OG ausgeschalt, 2 Kiesnester an Stuetze D4 muessen verpresst werden"
        - "Heizung (Firma Waerme): Rohrleitungen EG verlegt, Druckpruefung 10 bar bestanden"
        - "Elektro (Firma Strom): Schlitze 1.OG gefraest, Leerrohre 70% eingebaut"
        - "Trockenbau (Firma Wand): Staenderwerk 2.OG aufgestellt"
        - "Koordinationsbedarf: Heizungsrohre im 2.OG liegen teils im Trockenbau-Querschnitt"
        - "Koordination Elektro/Trockenbau wegen Deckenabhaengung erforderlich"

  - task_id: L2_subcontractor_coordination
    level: L2
    description: >
      Erstelle einen Nachunternehmer-Koordinationsbericht aus folgender
      Baubesprechung: Baustelle Einkaufszentrum CityPlaza, 11.04.2026.
      Teilnehmer: Generalunternehmer (GU) Projektleiter Dr. Lang,
      Nachunternehmer (NU) Fassade (Alu-Tech GmbH, Herr Yilmaz),
      NU Tiefbau (ErdBau AG, Frau Berger), NU Aufzuege (LiftPro, Herr Kim).
      Dr. Lang: "Fassade haengt 2 Wochen hinter Plan. Was ist das Problem?"
      Yilmaz: "Die Sonderfenster aus Polen kommen erst KW 18 statt KW 16."
      Dr. Lang: "Dann zieht ihr die Standardelemente Suedseite vor."
      Berger: "Tiefbau Parkplatz ist naechste Woche fertig, dann
      koennte Fassade Nordseite vom Boden aus arbeiten." Kim: "Aufzugs-
      schacht muss bis Ende April betonfertig sein, sonst verschieben
      sich unsere Monteure." Dr. Lang: "Terminplan wird angepasst,
      ich schicke allen die neue Version bis Freitag."
    ground_truth:
      required_claims:
        - "Die Besprechung fand auf der Baustelle Einkaufszentrum CityPlaza am 11.04.2026 statt"
        - "Die Fassade haengt 2 Wochen hinter dem Plan wegen verzoegerter Sonderfenster aus Polen"
        - "Die Sonderfenster kommen erst KW 18 statt KW 16"
        - "Standardelemente Suedseite sollen vorgezogen werden"
        - "Tiefbau Parkplatz (ErdBau AG, Frau Berger) ist naechste Woche fertig"
        - "Der Aufzugsschacht muss bis Ende April betonfertig sein (LiftPro, Herr Kim)"
        - "Der Terminplan wird angepasst und bis Freitag verschickt"

  - task_id: L2_weekly_progress_summary
    level: L2
    description: >
      Erstelle eine woechentliche Fortschrittszusammenfassung:
      Baustelle Seniorenresidenz Am Park, KW 15/2026 (07.-11.04).
      Montag-Mittwoch: Bewehrung Decke 1.OG, 35 Tonnen Stahl verlegt.
      Donnerstag: Betonage Decke 1.OG, 120 m3 C25/30. Freitag:
      Ausschalarbeiten begonnen, Schalung 2.OG Waende vorbereitet.
      Personal: Durchschnitt 18 Arbeiter/Tag. Wetter: Mo-Mi trocken,
      Do Leichter Regen (kein Einfluss), Fr sonnig. Soll-Stand laut
      Bauzeitenplan: Decke 1.OG KW 14 — tatsaechlich KW 15, also
      1 Woche Rueckstand. Ursache: Materiallieferung Bewehrung verzoegert
      in KW 14. Prognose: Aufholen durch Samstagsarbeit in KW 16/17.
    ground_truth:
      required_claims:
        - "Der Bericht betrifft die Baustelle Seniorenresidenz Am Park fuer KW 15/2026"
        - "Montag bis Mittwoch wurde die Bewehrung Decke 1.OG verlegt, 35 Tonnen Stahl"
        - "Am Donnerstag erfolgte die Betonage Decke 1.OG mit 120 m3 C25/30"
        - "Durchschnittlich waren 18 Arbeiter pro Tag im Einsatz"
        - "Es besteht 1 Woche Rueckstand gegenueber dem Bauzeitenplan"
        - "Die Ursache ist eine verzoegerte Materiallieferung Bewehrung in KW 14"
        - "Der Rueckstand soll durch Samstagsarbeit in KW 16/17 aufgeholt werden"

  - task_id: L2_quality_audit_report
    level: L2
    description: >
      Erstelle einen Qualitaetsauditbericht aus folgender Pruefung:
      Baustelle Hotelneubau Seeblick, 10.04.2026. Auditor: QM-Beauftragter
      Lehmann. Geprueft: Betonqualitaet (Pruefzeugnisse 3 Lieferungen —
      alle konform), Bewehrungsabnahme Decke EG (Bewehrungsplan Rev. C
      vom 02.04 — Verlegung OK, Betondeckung min. 30mm eingehalten),
      Abdichtung Kelleraussenwand (Bitumenbahn V60S5 — 2 Stellen mit
      ungenuegender Nahtverschwiessung festgestellt, Laenge je ca. 50cm,
      Nacharbeit erforderlich). Mauerwerk EG: Lotroechtigkeit geprueft,
      Abweichung Wand B3 = 8mm auf 2,5m Hoehe (Toleranz 10mm — OK).
      Gesamtbewertung: 2 kleine Abweichungen, keine schwerwiegenden Maengel.
    ground_truth:
      required_claims:
        - "Das Audit fand am 10.04.2026 auf der Baustelle Hotelneubau Seeblick statt"
        - "QM-Beauftragter Lehmann fuehrte das Audit durch"
        - "Betonqualitaet: Pruefzeugnisse von 3 Lieferungen sind alle konform"
        - "Bewehrungsabnahme Decke EG: Betondeckung min. 30mm eingehalten"
        - "Abdichtung Kelleraussenwand: 2 Stellen mit ungenuegender Nahtverschwiessung (je ca. 50cm), Nacharbeit erforderlich"
        - "Mauerwerk EG Wand B3: Abweichung 8mm auf 2,5m Hoehe (Toleranz 10mm, OK)"
        - "Gesamtbewertung: 2 kleine Abweichungen, keine schwerwiegenden Maengel"

  - task_id: L2_rework_documentation
    level: L2
    description: >
      Erstelle eine Nacharbeitsdokumentation mit Kostenaufstellung:
      Baustelle Lagergebaeude Ost, 09.04.2026. Mangel: Estrich im
      Hallenbereich (ca. 450 m2) hat grossflaechige Risse, wurde als
      nicht begehbar eingestuft. Ursache: Zu fruehes Belasten durch
      Regallager-Montage (2 Tage nach Einbau statt vorgeschriebene
      28 Tage). Nacharbeit: Kompletter Rueckbau Estrich (12 EUR/m2),
      Neueinbau CT-C30-F5 (38 EUR/m2), Trocknungszeit 4 Wochen,
      Regalmontage verschiebt sich um 6 Wochen. Kosten: Rueckbau
      5.400 EUR, Neueinbau 17.100 EUR, Bauzeitzuschlag 8.500 EUR.
      Gesamt: 31.000 EUR. Verschulden: NU Regalbau (Firma LogiMount)
      — Rueckgriff wird geprueft.
    ground_truth:
      required_claims:
        - "Der Mangel betrifft Estrich im Hallenbereich von ca. 450 m2 mit grossflaechigen Rissen"
        - "Die Ursache war zu fruehes Belasten durch Regallager-Montage (2 Tage statt 28 Tage)"
        - "Rueckbaukosten betragen 5.400 EUR (12 EUR/m2)"
        - "Neueinbaukosten betragen 17.100 EUR (38 EUR/m2, CT-C30-F5)"
        - "Der Bauzeitzuschlag belaeuft sich auf 8.500 EUR"
        - "Die Gesamtkosten betragen 31.000 EUR"
        - "Das Verschulden liegt bei Firma LogiMount (NU Regalbau), Rueckgriff wird geprueft"
        - "Die Regalmontage verschiebt sich um 6 Wochen"

  - task_id: L2_site_meeting_minutes
    level: L2
    description: >
      Erstelle ein Baubesprechungsprotokoll aus folgendem Gespraech:
      Baustelle Quartier Westend, 15.04.2026, Jour Fixe Nr. 22.
      Teilnehmer: Architekt Schwarz, Bauleiter Jung, Statiker Prof.
      Wendt, Fachplaner TGA Herr Adler. Schwarz: "Die Fassadenfarbe
      RAL 7016 ist vom Bauherrn freigegeben." Jung: "Gut. Naechster
      Punkt: Die Decke UG2 hat eine Durchbiegung von 15mm, Prof. Wendt?"
      Wendt: "Im Rahmen, L/500 waere 16mm bei 8m Spannweite. Ich
      schicke die Stellungnahme bis Montag." Adler: "Die Lueftungsanlage
      braucht einen zusaetzlichen Deckenausbruch in Achse 7, 60x80cm.
      Bitte Statikfreigabe einholen." Jung: "Termin naechste Sitzung
      22.04 gleiche Uhrzeit. Bitte alle offenen Punkte bis dahin abarbeiten."
    ground_truth:
      required_claims:
        - "Es handelt sich um Jour Fixe Nr. 22 auf der Baustelle Quartier Westend am 15.04.2026"
        - "Teilnehmer: Architekt Schwarz, Bauleiter Jung, Statiker Prof. Wendt, Fachplaner TGA Herr Adler"
        - "Die Fassadenfarbe RAL 7016 wurde vom Bauherrn freigegeben"
        - "Die Decke UG2 hat eine Durchbiegung von 15mm (im Rahmen, L/500 waere 16mm bei 8m Spannweite)"
        - "Prof. Wendt schickt die Stellungnahme bis Montag"
        - "Ein zusaetzlicher Deckenausbruch in Achse 7 (60x80cm) fuer die Lueftungsanlage ist erforderlich"
        - "Die naechste Sitzung findet am 22.04 statt"

  # ============================================================
  # L3 — Complex (7 tasks): Significant expansion needed
  # Calculations, DIN references, new report types
  # ============================================================

  - task_id: L3_acceptance_protocol
    level: L3
    description: >
      Erstelle ein Abnahmeprotokoll mit Maengelkatalog und Kostenberechnung:
      Objekt: Mehrfamilienhaus Rosenweg 14, Abnahme am 08.04.2026.
