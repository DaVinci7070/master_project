  - task_id: L5_schema_discovery_report
    level: L5
    description: >
      Verbinde dich mit der Baustellendatenbank (Host: benchmark-db,
      Port: 5432, User: benchmark, Passwort: bench2024, DB: lumari_benchmark_db).

      Aufgabe: Analysiere das Datenbankschema, verstehe die Tabellenstruktur und
      erstelle einen vollständigen Baufortschritts-Report für alle aktiven Projekte.

      Der Report soll enthalten:
      - Projektübersicht (Name, Zeitraum, Budget)
      - Fortschritt pro Gewerk (Prozent, Status, Trend)
      - Offene Mängel nach Schweregrad
      - Kostenübersicht (Soll vs. Ist)
      - Risiken und Empfehlungen
    ground_truth:
      required_claims:
        - "Projekt 'Neubau Wohnanlage Bergstraße 12' wird identifiziert"
        - "Projekt 'Sanierung Grundschule Am Park' wird identifiziert"
        - "Rohbau-Fortschritt wird korrekt mit ca. 85% angegeben"
        - "Verzögerung im Gewerk Elektro wird erkannt und benannt"
        - "Mindestens 3 offene kritische Mängel werden aufgelistet"
        - "Gesamtkosten werden als Summe berechnet und dem Budget gegenübergestellt"
        - "Mindestens ein konkreter Mangel mit Beschreibung wird genannt"
        - "Eine Risikoeinschätzung oder Empfehlung wird formuliert"
        - "Fortschritt von mindestens 4 Gewerken wird einzeln ausgewiesen"

  - task_id: L5_etl_quarterly_report
    level: L5
    data_dir: data/etl_csvs
    data_target: etl_data
    description: >
      Im Verzeichnis /data/etl_data/ befinden sich 50 CSV-Dateien mit
      Tagesberichten von 5 verschiedenen Subunternehmern (Q3/2025, Juli-September).
      Dateiformat: {subunternehmer}_{datum}.csv mit Spalten:
      datum, gewerk, taetigkeit, arbeiter, stunden, material, material_menge,
      material_einheit, bemerkung.

      Aufgabe:
      1. Analysiere die CSV-Struktur und erkenne die 5 Subunternehmer
      2. Entwirf ein normalisiertes Datenbankschema (mindestens: Subunternehmer,
         Gewerke, Tageseintraege, Material) und erstelle es in der Datenbank
         (Host: host.docker.internal, Port: 5433, User: benchmark,
         Passwort: bench2024, DB: lumari_benchmark_db)
      3. Lade alle 50 CSVs in die normalisierte Struktur
      4. Erstelle eine Quartalsübersicht Q3/2025 mit:
         - Gesamtstunden und -kosten pro Subunternehmer
         - Top-5 Materialposten nach Kosten
         - Monatlicher Verlauf (Juli/Aug/Sept) pro Gewerk
         - Identifizierte Datenqualitaetsprobleme (Tippfehler, fehlende Werte)
         - Empfehlung zur Budgetplanung Q4
    ground_truth:
      required_claims:
        - "5 Subunternehmer werden korrekt identifiziert (Müller, Schmidt, Weber, Krause, Hoffmann)"
        - "Gesamtstunden Rohbau Schmidt werden mit ca. 680h angegeben"
        - "Gesamtstunden Elektro Müller werden mit ca. 420h angegeben"
        - "Materialkosten werden pro Subunternehmer aggregiert"
        - "Ein monatlicher Verlauf (Juli, August, September) wird dargestellt"
        - "Datenqualitaetsprobleme werden erkannt (Tippfehler oder Varianten in Bezeichnungen)"
        - "Mindestens 3 der Top-5 Materialposten werden korrekt genannt"
        - "Eine Empfehlung oder Prognose fuer Q4 wird formuliert"
        - "Die CSV-Dateien werden erfolgreich gelesen (Anzahl 50 wird erwaehnt oder impliziert)"
        - "Normalisiertes Schema wird erstellt oder beschrieben (mindestens 3 Tabellen)"

