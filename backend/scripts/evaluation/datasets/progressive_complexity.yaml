        - "Aufzug: Kabinengroesse 110x140cm (Minimum — grenzwertig)"
        - "Notrufschnur endet bei 70cm statt max 20cm ueber Boden (DIN 18040-1 Abs. 5.3.3 — NICHT ERFUELLT)"
        - "Taktiles Leitsystem im Foyer fehlt (DIN 18040-1 Abs. 4.3.4 erforderlich)"
        - "Ergebnis: 2 Maengel (Notrufschnur und Leitsystem), Rest OK"

