suite: domain_transfer
description: >
  24 tasks across two non-construction domains (IT-Incidents, Meeting Protocols)
  to test skill transfer and domain adaptation speed.
tasks:
  # ============================================================
  # IT-Incident Reports (12 tasks, L1-L4)
  # ============================================================

  - task_id: IT_L1_server_outage
    level: L1
    description: >
      Erstelle einen IT-Stoerungsbericht aus folgender Meldung:
      Datum: 14.04.2026, 09:23 Uhr. System: Webserver PROD-WEB-03.
      Meldung durch Monitoring (Nagios Alert). Server nicht erreichbar
      seit 09:20 Uhr. Ursache: Festplatte /dev/sda1 voll (100%).
      Loesung: Log-Rotation konfiguriert, alte Logs geloescht (45 GB
      freigegeben). Server um 09:41 Uhr wieder online. Betroffene
      Nutzer: ca. 200 (Kundenportal). Downtime: 21 Minuten.
    ground_truth:
      required_keywords:
        - Stoerungsbericht
        - PROD-WEB-03
        - Festplatte
        - Log-Rotation
        - Downtime
      required_sections:
        - Vorfalldaten
        - Ursache
        - Loesung
        - Auswirkung

  - task_id: IT_L1_network_disruption
    level: L1
    description: >
      Erstelle einen Netzwerkstoerungsbericht: Datum 13.04.2026,
      14:05 Uhr. Standort Buero Frankfurt 3. OG. Meldung durch
      Mitarbeiter Abteilung Vertrieb. Symptom: Kein Internetzugang,
      VPN-Verbindung bricht ab. Ursache: Switch SW-FFM-3F-01 nach
      Firmware-Update nicht korrekt gestartet. Loesung: Manueller
      Neustart des Switches durch IT-Techniker Herr Park um 14:32 Uhr.
      Wiederherstellung um 14:35 Uhr. Betroffene: 35 Arbeitsplaetze.
    ground_truth:
      required_keywords:
        - Netzwerkstoerung
        - Frankfurt
        - Switch
        - Firmware
        - Neustart
        - VPN
      required_sections:
        - Vorfalldaten
        - Symptom
        - Ursache
        - Loesung

  - task_id: IT_L1_password_reset_incident
    level: L1
    description: >
      Erstelle einen Incident-Bericht: Datum 12.04.2026, Ticket INC-4821.
      Nutzer Frau Berger (Abteilung HR) meldet: Kann sich nicht am
      SAP-System anmelden, Fehlermeldung "Account locked". Analyse:
      5 fehlgeschlagene Anmeldeversuche innerhalb 2 Minuten, automatische
      Sperrung nach Policy (3 Versuche). Ursache: Passwort am Freitag
      geaendert, Nutzerin hat neues Passwort vergessen. Loesung:
      Passwort-Reset durch IT-Support Herr Tran, Account entsperrt.
      Dauer: 15 Minuten bis zur Loesung.
    ground_truth:
      required_keywords:
        - Incident
        - Berger
        - SAP
        - Account
        - Passwort
        - Sperrung
      required_sections:
        - Ticketdaten
        - Problem
        - Analyse
        - Loesung

  - task_id: IT_L2_multi_team_incident
    level: L2
    description: >
      Erstelle einen mehrstufigen Incident-Bericht aus folgendem
      Gespraechsprotokoll: Datum 11.04.2026.
      09:00 - Monitoring meldet: Datenbank-Cluster DB-PROD-CLUSTER
      Replikations-Lag > 30s (Schwellwert 5s).
      09:05 - DBA-Team (Herr Ozdemir) beginnt Analyse: Primary Node
      DB-01 CPU bei 98%, Query-Queue aufgestaut.
      09:12 - Applikationsteam (Frau Chen) meldet: API Response-Zeiten
      > 10s, Timeout-Errors in Kundenapp haeufen sich.
      09:20 - Ozdemir: "Ich sehe eine Langlaeufer-Query vom Reporting-
      Cronjob, die blockiert den Primary. Kill ich die."
      09:22 - Query beendet, CPU sinkt auf 45%, Replikation holt auf.
      09:30 - Chen: "API-Zeiten wieder normal, keine Timeouts mehr."
      09:35 - Ozdemir: "Reporting-Cronjob auf Read-Replica umgeleitet,
      damit das nicht nochmal passiert."
      Postmortem-Aktion: Langlaeufer-Queries auf Read-Replica erzwingen.
    ground_truth:
      required_keywords:
        - Datenbank
        - Replikation
        - Ozdemir
        - Chen
        - CPU
        - Query
        - Read-Replica
      required_sections:
        - Timeline
        - Ursache
        - Loesung
        - Postmortem

  - task_id: IT_L2_change_incident_combined
    level: L2
    description: >
      Erstelle einen kombinierten Incident- und Change-Report:
      Change CHG-2026-0189: Geplantes Update Kubernetes-Cluster
      PROD-K8S auf Version 1.30, Termin 10.04.2026 22:00-02:00 Uhr.
      Change-Team: DevOps (Herr Singh, Frau Weber). Durchfuehrung:
      22:00 Node-Drain gestartet. 22:15 Rolling-Update Node 1 OK.
      22:30 Node 2 Update — Pod payment-service crasht im Loop
      (CrashLoopBackOff). 22:35 Incident INC-5002 eroeffnet. Analyse:
      payment-service nutzt deprecated API (batch/v1beta1), in K8s
      1.30 entfernt. 22:50 Rollback Node 2 auf 1.29 (Singh).
      23:00 payment-service laeuft wieder. 23:10 Change auf "failed"
      gesetzt, Rollback Node 1 eingeleitet. 23:30 Cluster zurueck
      auf 1.29. Massnahme: payment-service API-Manifest aktualisieren
      vor naechstem Update-Versuch. Neuer Change-Termin: KW 17.
    ground_truth:
      required_keywords:
        - Kubernetes
        - Change
        - Rollback
        - payment-service
        - CrashLoopBackOff
        - Singh
        - deprecated
      required_sections:
        - Change-Daten
        - Durchfuehrung
        - Incident
        - Rollback
        - Massnahmen

  - task_id: IT_L2_capacity_planning
    level: L2
    description: >
      Erstelle einen Kapazitaetsplanungsbericht aus folgenden Daten:
      System: E-Commerce-Plattform shop.example.de. Zeitraum Q1/2026.
      Peak-Last Black Friday 2025: 12.000 Requests/s (Kapazitaet
      15.000 req/s — 80% Auslastung). Wachstum Q1/2026: +25% Traffic
      gegenueber Q1/2025. Aktuelle Infrastruktur: 8 App-Server (je
      2 vCPU, 8GB RAM), 3 DB-Nodes (je 8 vCPU, 32GB). Storage:
      2.4 TB belegt von 5 TB (48%). Prognose Weihnachten 2026:
      15.000 req/s erwartet (+25%), aktuelle Kapazitaet NICHT ausreichend.
      Empfehlung: 4 zusaetzliche App-Server (Kosten: 2.400 EUR/Monat),
      1 zusaetzlicher DB-Read-Replica (800 EUR/Monat), CDN-Erweiterung
      (500 EUR/Monat). Gesamt-Mehrkosten: 3.700 EUR/Monat.
    ground_truth:
      required_keywords:
        - Kapazitaet
        - E-Commerce
        - Requests
        - Auslastung
        - Prognose
        - App-Server
        - Mehrkosten
      required_sections:
        - Ist-Zustand
        - Wachstumsanalyse
        - Prognose
        - Empfehlung
        - Kosten

  - task_id: IT_L3_root_cause_analysis
    level: L3
    description: >
      Erstelle eine Root-Cause-Analyse mit Zeitlinienrekonstruktion:
      Major Incident INC-5100, 08.04.2026. Dauer: 4 Stunden 23 Minuten.
      Betroffenes System: Zahlungsabwicklung (Payment Gateway).
      Timeline: 06:12 - Erste Fehlermeldungen (HTTP 502) bei 0,3% der
      Transaktionen. 06:30 - Fehlerrate steigt auf 5%, Monitoring
      alertet. 06:45 - Incident-Commander Frau Koch uebernimmt. 07:00 -
      Analyse: SSL-Zertifikat des Payment-Providers abgelaufen um
      06:00 UTC (Intermediate CA, nicht das Root). 07:15 - Provider
      kontaktiert, bestaetigt Zertifikatserneuerung in Arbeit. 08:30 -
      Workaround: Traffic auf Backup-Provider SWIFT-PAY umgeleitet
      (20% hoehere Transaktionsgebuehren). 09:00 - Primaer-Provider
      neues Zertifikat installiert. 09:30 - Schrittweise Rueckfuehrung
      auf Primaer-Provider. 10:35 - Normalbetrieb. Impact: 847
      fehlgeschlagene Transaktionen (Volumen 124.500 EUR), 2.130
      verzoegerte Transaktionen. Direkte Kosten Backup-Provider
      Mehrgebuehren: 3.200 EUR. RCA: Kein Monitoring auf Zertifikats-
      ablauf eingerichtet. Massnahme: Zertifikats-Monitoring mit
      30-Tage-Vorlauf implementieren, Runbook fuer Provider-Failover
      dokumentieren.
    ground_truth:
      required_keywords:
        - Root-Cause
        - Payment
        - SSL-Zertifikat
        - Koch
        - Failover
        - Transaktionen
        - Monitoring
      required_sections:
        - Timeline
        - Impact
        - Root-Cause
        - Workaround
        - Massnahmen
        - Kosten

  - task_id: IT_L3_postmortem_with_impact
    level: L3
    description: >
      Erstelle ein Post-Mortem mit Impact-Berechnung: Incident vom
      05.04.2026. System: CRM-Plattform (Salesforce-Integration).
      Ausfall 10:00-14:30 (4,5h). Ursache: Fehlerhaftes Deployment
      (Build v2.34.1) fuehrte zu Deadlock in der Synchronisations-Queue.
      Rollback auf v2.33.9 um 13:15, Queue-Bereinigung bis 14:30.
      Impact: 145 Vertriebsmitarbeiter ohne CRM-Zugriff. Geschaetzte
      Produktivitaetsverlust: 145 MA x 4,5h x 85 EUR/h = 55.462 EUR.
      Entgangene Leads (Pipeline-Analyse): 23 Leads nicht erfasst,
      durchschnittlicher Lead-Wert 4.200 EUR, Conversion-Rate 15% =
      geschaetzter entgangener Umsatz: 14.490 EUR. SLA-Verletzung:
      Uptime-Garantie 99,9% (max 43 Min/Monat), aktueller Monat
      bereits 270 Min Ausfall = SLA gebrochen, Penalitaet: 5%
      Gutschrift = 3.750 EUR. Gesamt-Impact: 73.702 EUR.
      5-Why-Analyse: 1) Deadlock → 2) Race Condition in Queue-Handler →
      3) Fehlender Integrationstest fuer Concurrent Writes →
      4) Test-Pipeline hat kein Load-Testing → 5) Load-Test-Infrastruktur
      nie aufgebaut. Massnahme: Load-Test-Stage in CI/CD, geschaetzte
      Implementierungskosten 12.000 EUR.
    ground_truth:
      required_keywords:
        - Post-Mortem
        - CRM
        - Deadlock
        - Rollback
        - SLA
        - 5-Why
        - Load-Test
      required_sections:
        - Vorfallzusammenfassung
        - Timeline
        - Impact-Berechnung
        - Root-Cause
        - 5-Why-Analyse
        - Massnahmen

  - task_id: IT_L3_disaster_recovery_test
    level: L3
    description: >
      Erstelle einen Disaster-Recovery-Testbericht: DR-Test am
      03.04.2026 fuer System ERP-Prod (SAP S/4HANA). Testszenario:
      Totalausfall Primaer-Rechenzentrum Frankfurt. RTO-Ziel: 4 Stunden,
      RPO-Ziel: 1 Stunde. Durchfuehrung: 08:00 Failover gestartet
      auf DR-Standort Muenchen. 08:15 Datenbank-Restore aus letztem
      Replikat (Alter: 47 Minuten — RPO OK). 09:30 Applikationsserver
      hochgefahren, SAP-Dienste starten. 10:15 Funktionstests: Buchungen,
      Materialwirtschaft, Finanzen — alle OK. 11:00 Performance-Test:
      Response-Zeiten 30% langsamer als Produktion (DR hat kleinere
      Hardware). 11:45 User-Acceptance: 5 Key-User testen, 1 Problem:
      Druckserver-Anbindung fehlt in DR. 12:00 Test abgeschlossen.
      Ergebnis: RTO erreicht (4h Ziel, 4h tatsaechlich — KNAPP).
      RPO erreicht. 2 Findings: Druckserver nicht im DR-Runbook,
      Performance-Degradation akzeptabel aber dokumentieren.
    ground_truth:
      required_keywords:
        - Disaster-Recovery
        - SAP
        - RTO
        - RPO
        - Failover
        - Muenchen
        - Druckserver
      required_sections:
        - Testszenario
        - Durchfuehrung
        - Ergebnis
        - Findings
        - Empfehlungen

  - task_id: IT_L4_security_breach_analysis
    level: L4
    description: >
      Erstelle eine Security-Breach-Analyse: Vorfall am 01.04.2026.
      System: Kundenportal portal.firma.de. Entdeckung: 01.04 08:15
      durch SIEM-Alert (ungewoehnlicher Datenbankzugriff aus IP-Range
      185.220.xxx). Analyse durch SOC-Team (Herr Dimitrov, Frau Al-Hassan).
      Angriffsverlauf rekonstruiert: 28.03 — Phishing-Mail an Mitarbeiter
      Support-Team, Credentials abgegriffen. 29.03 — Erster Login mit
      gestohlenen Credentials (VPN, IP aus Rumaenien). 30.03-31.03 —
      Lateral Movement: Zugriff auf Admin-Panel via Service-Account
      svc-portal-admin. 01.04 06:00-08:00 — Datenexfiltration:
      Export von 34.000 Kundendatensaetzen (Name, Email, Adresse,
      Telefon, KEINE Zahlungsdaten). Sofortmassnahmen: Alle Service-
      Accounts rotiert, VPN-Zugang gesperrt fuer nicht-deutsche IPs,
      betroffener Mitarbeiter-Account deaktiviert. Meldung DSGVO:
      Art. 33 Meldung an Aufsichtsbehoerde innerhalb 72h (Frist:
      04.04 08:15). Art. 34 Benachrichtigung Betroffener erforderlich
      (hohes Risiko). Forensische Sicherung der Log-Daten durch
      externes Forensik-Team (CyberDefense AG) beauftragt.
    ground_truth:
      required_keywords:
        - Security-Breach
        - Phishing
        - Exfiltration
        - DSGVO
        - Kundendaten
        - SOC
        - Forensik
        - Service-Account
      required_sections:
        - Vorfallzusammenfassung
        - Angriffsverlauf
        - Auswirkung
        - Sofortmassnahmen
        - DSGVO-Meldung
        - Forensik

  - task_id: IT_L4_compliance_audit
    level: L4
    description: >
      Erstelle einen IT-Compliance-Auditbericht: Audit nach ISO 27001
      am 31.03.2026 durch externen Auditor TUeV Sued (Frau Dr. Winter).
      Scope: ISMS der Firma TechCorp GmbH, 250 Mitarbeiter.
      A.5 Informationssicherheitsrichtlinien: Richtlinie vorhanden,
      Review-Zyklus 12 Monate — letzte Aktualisierung 15 Monate her,
      ABWEICHUNG (Minor). A.8 Asset-Management: Asset-Register gepflegt,
      aber 12% der Geraete ohne zugewiesenen Owner, ABWEICHUNG (Minor).
      A.9 Zugangssteuerung: MFA fuer alle Cloud-Dienste aktiviert (OK).
      Aber: 3 Admin-Accounts ohne MFA-Erzwingung auf Legacy-System
      SAP R/3, ABWEICHUNG (Major). A.12 Betriebssicherheit:
      Patch-Management-Prozess definiert, aber durchschnittliche
      Patch-Time fuer kritische CVEs: 18 Tage (Ziel: 7 Tage),
      ABWEICHUNG (Major). A.17 Business Continuity: DR-Plan
      dokumentiert, Test im Q1/2026 durchgefuehrt (OK). A.18
      Compliance: DSGVO-Verzeichnis der Verarbeitungstaetigkeiten
      aktuell (OK). Ergebnis: 2 Major, 2 Minor Abweichungen.
      Empfehlung: Re-Audit in 6 Monaten nach Korrekturmassnahmen.
    ground_truth:
      required_keywords:
        - Compliance
        - ISO 27001
        - TUeV
        - ISMS
        - MFA
        - Patch-Management
        - DSGVO
        - Abweichung
      required_sections:
        - Auditdaten
        - Pruefbereiche
        - Feststellungen
        - Bewertung
        - Empfehlungen

  - task_id: IT_L4_cloud_migration_assessment
    level: L4
    description: >
      Erstelle eine Cloud-Migrations-Bewertung: Firma FinServ AG
      plant Migration On-Premises ERP (SAP ECC 6.0) nach SAP S/4HANA
      Cloud. Assessment am 29.03.2026 durch Cloud-Architekt Herr Patel
      und SAP-Berater Frau Loewe. Bestandsaufnahme: 3 SAP-Server
      (DB: Oracle 19c, 4.2 TB Daten), 850 aktive User, 127 Custom
      ABAP-Programme, 34 Schnittstellen (12 RFC, 8 IDocs, 14 REST-APIs).
      Migrationsstrategie: Brownfield (System-Konvertierung, da hohe
      Customizing-Quote). Risikobewertung: Custom Code — 42 Programme
      nutzen deprecated APIs (Anpassungsaufwand geschaetzt 480 PT),
      Schnittstellen — 8 von 34 muessen neugebaut werden (120 PT).
      Kostenvergleich: On-Prem laufend 28.000 EUR/Monat (HW-Lease +
      Admin + Lizenzen). Cloud-Zielkosten: 35.000 EUR/Monat (Lizenzen
      + Compute + Support). Migrationskosten einmalig: 720.000 EUR.
      Break-Even: nicht vor 8 Jahren rein kostenbasiert — Migration
      primaer regulatorisch getrieben (Hersteller-Support-Ende 2027).
    ground_truth:
      required_keywords:
        - Cloud-Migration
        - SAP
        - Brownfield
        - ABAP
        - Schnittstellen
        - Break-Even
        - Support-Ende
      required_sections:
        - Bestandsaufnahme
        - Migrationsstrategie
        - Risikobewertung
        - Kostenvergleich
        - Empfehlung

