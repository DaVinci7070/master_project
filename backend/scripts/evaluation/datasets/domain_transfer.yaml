  - task_id: MP_L2_architecture_review
    level: L2
    description: >
      Erstelle ein Architektur-Review-Protokoll: Datum 09.04.2026.
      System: Microservice "Order-Management". Reviewer: Principal
      Architect Frau Dr. Sato, Senior Dev Herr Mueller, DevOps Herr Kim.
      Anlass: Service hat 15 Endpoints, Response-Zeiten steigen.
      Mueller: "Wir haben 3 synchrone Calls zu Inventory, Payment und
      Shipping pro Order. Das dauert zusammen 800ms." Sato: "Klassisches
      Distributed-Monolith-Problem. Payment und Shipping koennen async
      laufen." Kim: "Wenn wir auf Events umstellen, brauchen wir
      einen Message-Broker. Wir haben schon RabbitMQ im Stack."
      Sato: "Gut, dann Event-Driven fuer Payment und Shipping.
      Inventory bleibt synchron wegen Stock-Check. Erwartet: Latenz
      von 800ms auf 300ms." Mueller: "Was ist mit Eventual Consistency?"
      Sato: "Akzeptabel — Order-Status zeigt 'processing' bis Events
      bestaetigt sind. Maximal 5s Verzoegerung."
      Entscheidung: Async Events via RabbitMQ fuer Payment+Shipping.
    ground_truth:
      required_keywords:
        - Architektur
        - Order-Management
        - Microservice
        - RabbitMQ
        - Event-Driven
        - Latenz
        - Sato
      required_sections:
        - Anlass
        - Ist-Zustand
        - Diskussion
