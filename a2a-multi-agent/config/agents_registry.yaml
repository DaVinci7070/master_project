# backend/config/agents_registry.yaml

agents:
  agent_summarizer:
    id: agent_summarizer
    name: "Summarizer Agent"
    description: "Erzeugt strukturierte Berichte aus Transkripten. Muss VOR dem agent_guard ausgeführt werden."
    url: "http://summarizer:8001"   # Basis-URL, ohne /a2a
    input_slots:
      transcript:
        description: "Original-Transkript als Text"
        required: true
        type: "text"
        artifact_hints: ["original_transcript", "normalized_transcript"]
      context_documents:
        description: "Optionale Liste von Kontextdokumenten (RAG-Resultate)"
        required: false
        type: "json"
        artifact_hints: ["context_documents"]
      template_result:
        description: "Das Template, in dessen Struktur der Bericht erstellt werden soll."
        required: true
        type: "json"
        artifact_hints: ["template_result", "template_selection"]
      defect_list:
        description: "Strukturierte Mängelliste vom Defect Agent"
        required: false
        type: "json"
        artifact_hints: ["defect_result", "defect_list"]
      safety_report:
        description: "Sicherheitsbericht vom Safety Agent"
        required: false
        type: "json"
        artifact_hints: ["safety_result", "safety_report"]
      claim_report:
        description: "Nachtragsbericht vom Claim Agent"
        required: false
        type: "json"
        artifact_hints: ["claim_result", "claim_report"]
      quality_report:
        description: "Qualitätsbericht vom Quality Agent"
        required: false
        type: "json"
        artifact_hints: ["quality_result", "quality_report"]
    output_slots:
      summary_report:
        description: "Strukturierter JSON-Bericht"
        type: "text"
        default_artifact_key: "final_report"

  agent_template:
    id: agent_template
    name: "Template Agent"
    description: "Selektiert das passende Berichtstemplate (template_result). Produziert die Grundlage für den Summarizer und Question-Agent."
    url: "http://template:8006"
    input_slots:
      transcript:
        description: "Transkript, aus dem die gewünschte Template-Art abgeleitet wird."
        required: true
        type: "text"
        artifact_hints: ["original_transcript"]
      user_id:
        description: "User-ID, um nur Templates dieses Nutzers im Qdrant-Vektorraum zu durchsuchen."
        required: true
        type: "text"
        artifact_hints: ["user_id"]
      template_id:
        description: "Optionale Template-ID, die direkt geladen werden soll."
        required: false
        type: "text"
        artifact_hints: ["template_id"]
    output_slots:
      template_result:
        description: "Ausgewähltes Template inkl. ID und Name als TemplateResult."
        type: "json"
        default_artifact_key: "template_result"

  agent_guard:
    id: agent_guard
    name: "Guard Agent"
    description: "Qualitätssicherung: Prüft den fertigen Bericht (final_report) auf Konsistenz. Benötigt zwingend den Output vom agent_summarizer."
    url: "http://guard:8005"
    input_slots:
      transcript:
        description: "Original-Transkript (Quelle der Wahrheit)"
        required: true
        type: "text"
        artifact_hints: ["original_transcript"]
      report:
        description: "Zu prüfender Bericht (JSON oder Text)"
        required: true
        type: "text"
        artifact_hints: ["final_report"]
      context_documents:
        description: "RAG-Kontextdokumente (zusätzlich zum Transkript als valide Quelle)"
        required: false
        type: "json"
        artifact_hints: ["context_documents"]
    output_slots:
      corrected_report:
        description: "Korrigierte Version des Berichts"
        type: "text"
        default_artifact_key: "final_report"

  agent_rag:
    id: agent_rag
    name: "RAG Agent"
    description: "Holt ähnliche Reports über MCP-Tools und liefert kompakten Kontext für Downstream-Agents."
    url: "http://rag:8004"
    input_slots:
      user_id:
        description: "User-ID für MCP-Suche (Qdrant/RAG)."
        required: true
        type: "text"
        artifact_hints: ["user_id"]
      transcript:
        description: "Original-Transkript als Grundlage für die Retrieval-Planung."
        required: true
        type: "text"
        artifact_hints: ["original_transcript", "normalized_transcript", "transcript"]
    output_slots:
      context_documents:
        description: "Liste von Kontext-Items bzw. ähnlichen Berichten aus der Vergangenheit die Relevant sein könnten. "
        type: "json"
        default_artifact_key: "context_documents"

  agent_question:
    id: agent_question
    name: "Question Agent (QS-Validator)"
    description: "Mandatorischer Gatekeeper: Validiert das Transkript gegen das template_result. Erzeugt zwingend HITL-Fragen bei Unvollständigkeit (Stoppt Prozess)."
    url: "http://question:8007"
    input_slots:
      transcript:
        description: "Original-Transkript als Quelle der Wahrheit"
        required: true
        type: "text"
        artifact_hints: ["original_transcript"]
      template_result:
        description: "Das gewählte Template zur QS-Validierung (Pflichtfelder-Check)"
        required: true
        type: "json"
        artifact_hints: ["template_result"]
      user_id:
        description: "User-ID für Kontext"
        required: false
        type: "text"
        artifact_hints: ["user_id"]
    output_slots:
      question_result:
        description: "Kritisches QS-Ergebnis: Falls Informationen fehlen, wird hier der HITL-Prozess (Rückfragen) ausgelöst."
        type: "json"
        default_artifact_key: "question_result"

  agent_defect:
    id: agent_defect
    name: "Defect Agent"
    description: "Spezialisierter Agent zur Extraktion und Klassifizierung von Baumängeln aus Baustellentranskripten. Analysiert Risse, Feuchtigkeit, Materialschäden und Ausführungsfehler."
    url: "http://defect:8008"
    input_slots:
      transcript:
        description: "Transkript zur Mängelanalyse"
        required: true
        type: "text"
        artifact_hints: ["original_transcript"]
    output_slots:
      defect_result:
        description: "Liste der extrahierten Mängel mit Schweregrad und Handlungsbedarf"
        type: "json"
        default_artifact_key: "defect_result"
    tags: ["defect", "quality", "construction", "mängel"]

  agent_safety:
    id: agent_safety
    name: "Safety Agent"
    description: "Spezialisierter Agent zur Analyse von Arbeitssicherheit auf Baustellen. Identifiziert Unfälle, Gefahren, PSA-Verstöße und bewertet den Compliance-Status nach HSE-Standards."
    url: "http://safety:8009"
    input_slots:
      transcript:
        description: "Transkript zur Sicherheitsanalyse"
        required: true
        type: "text"
        artifact_hints: ["original_transcript"]
    output_slots:
      safety_result:
        description: "Liste der Sicherheitsvorfälle mit Schweregrad und Compliance-Status"
        type: "json"
        default_artifact_key: "safety_result"
    tags: ["safety", "hse", "construction", "accident", "hazard", "sicherheit"]

  agent_claim:
    id: agent_claim
    name: "Claim Agent"
    description: "Spezialisierter Agent zur Extraktion und Analyse von Nachträgen, Regiearbeiten und Planänderungen aus Baustellentranskripten. Identifiziert potenzielle Mehrkosten-Sachverhalte."
    url: "http://claim:8010"
    input_slots:
      transcript:
        description: "Transkript zur Claim-Analyse"
        required: true
        type: "text"
        artifact_hints: ["original_transcript"]
    output_slots:
      claim_result:
        description: "Liste der extrahierten Claims/Nachträge mit Typ und geschätzter Auswirkung"
        type: "json"
        default_artifact_key: "claim_result"
    tags: ["claim", "nachtrag", "regie", "construction", "mehrkosten", "zusatzleistung"]

  agent_quality:
    id: agent_quality
    name: "Quality Agent"
    description: "Spezialisierter Agent zur Extraktion von technischen Qualitätsdaten. Analysiert Materialspezifikationen, DIN-Normen, Prüfungen und Qualitätsprobleme aus Baustellentranskripten."
    url: "http://quality:8011"
    input_slots:
      transcript:
        description: "Transkript zur Qualitätsanalyse"
        required: true
        type: "text"
        artifact_hints: ["original_transcript"]
    output_slots:
      quality_result:
        description: "Extrahierte Qualitätsinformationen (Materialien, Normen, Prüfungen)"
        type: "json"
        default_artifact_key: "quality_result"
    tags: ["quality", "materials", "norms", "DIN", "construction", "qualität", "prüfung"]
